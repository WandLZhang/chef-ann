# ============================================================================
# Pre-commit Configuration — chef-ann
# Covers: Standard hooks, Python (Ruff/Bandit), TS/JS (ESLint/TSC),
#         Shell, Security (Trivy/Gitleaks/Semgrep), YAML, Commit Messages
# ============================================================================
repos:
  # -- Standard hooks --------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents", "--unsafe"]
      - id: check-json
        exclude: tsconfig(\..*)?\.json$
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # -- Python: Ruff (Linting + Formatting) -----------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^(functions|scripts|src)/
      - id: ruff-format
        files: ^(functions|scripts|src)/

  # -- TypeScript/JavaScript: ESLint & Typecheck -----------------------------
  - repo: local
    hooks:
      - id: typecheck
        name: TypeScript type check (tsc)
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
      # NOTE: ESLint via `next lint` has CLI compat issues in Next.js 16.
      # TSC (above) covers type safety. Run `cd frontend && npm run lint` manually.
      # TODO: Re-enable once Next.js 16 CLI is stable with pre-commit.
      # - id: eslint
      #   name: ESLint (next lint)
      #   entry: bash -c 'cd frontend && npx next lint .'
      #   language: system
      #   files: ^frontend/.*\.(ts|tsx|js|jsx)$
      #   pass_filenames: false

  # -- Security: Bandit (Python SAST) ----------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-r", "-ll", "--skip=B101,B104,B108,B311,B324"]
        files: ^(functions|scripts|src)/

  # -- Security: Semgrep (Multi-language SAST) -------------------------------
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.37.0
    hooks:
      - id: semgrep
        name: Semgrep
        args: ["--config=auto", "--error"]
        pass_filenames: false

  # -- Security: Trivy (Vuln, Secret, Misconfig Scanner) ---------------------
  - repo: local
    hooks:
      - id: trivy-fs
        name: Trivy filesystem scan
        entry: bash -c 'trivy fs --scanners vuln,secret,misconfig --skip-dirs .venv,node_modules,frontend/node_modules,frontend/.next,context --severity CRITICAL --exit-code 1 .'
        language: system
        pass_filenames: false
        always_run: true

  # -- Security: Gitleaks (Hardcoded Secrets) --------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks

  # -- Shell: Shellcheck -----------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["-x", "-S", "warning"]

  # -- YAML: Yamllint --------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-d", "{extends: relaxed, rules: {line-length: {max: 250}, indentation: disable}}"]

  # -- Commit Messages: Conventional Commits ---------------------------------
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.21.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  # ==========================================================================
  # MANUAL STAGES (Run via `pre-commit run --hook-stage manual --all-files`)
  # ==========================================================================
  - repo: local
    hooks:
      - id: npm-audit
        name: npm audit
        entry: bash -c 'cd frontend && npm audit --audit-level=high'
        language: system
        pass_filenames: false
        stages: [manual]

      - id: pip-audit
        name: pip-audit
        entry: bash -c 'pip-audit -r functions/requirements.txt'
        language: system
        pass_filenames: false
        stages: [manual]
